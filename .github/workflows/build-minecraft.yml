name: Build Block World Game Ca Voi

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-minecraft.yml"
      - "tools/customize-block-world.py"
      - "tools/add-block-world-multiplayer.py"
      - "tools/fix-block-world-multiplayer.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Game Ca Voi
        uses: actions/checkout@v4

      - name: Download upstream source
        run: |
          rm -rf /tmp/minecraft-clone
          git clone --depth 1 https://github.com/Vincent-P-essy/minecraft-clone.git /tmp/minecraft-clone

      - name: Viet hoa toan bo giao dien
        run: python3 tools/customize-block-world.py /tmp/minecraft-clone

      - name: Them choi cung nhau
        run: python3 tools/add-block-world-multiplayer.py /tmp/minecraft-clone

      - name: Sua loi TypeScript multiplayer
        run: python3 tools/fix-block-world-multiplayer.py /tmp/minecraft-clone

      - name: Install and build
        working-directory: /tmp/minecraft-clone
        run: |
          npm ci
          npm install @supabase/supabase-js@2 --no-save
          npm run build

      - name: Publish independent build
        run: |
          rm -rf minecraft
          mkdir -p minecraft
          cp -R /tmp/minecraft-clone/dist/. minecraft/
          cp /tmp/minecraft-clone/LICENSE minecraft/LICENSE

          cat > minecraft/SOURCE.md <<'EOF'
          # Block World – Game Cá Voi
          
          Phát triển từ dự án mã nguồn mở:
          https://github.com/Vincent-P-essy/minecraft-clone
          
          Tác giả dự án gốc: Vincent Plessy
          Giấy phép: MIT
          
          Phiên bản Game Cá Voi đã bổ sung:
          - Việt hóa giao diện.
          - Điều khiển cảm ứng cho trẻ em.
          - Tạo phòng / vào phòng bằng mã.
          - Hiển thị người chơi khác trong thế giới 3D.
          - Đồng bộ vị trí gần thời gian thực.
          - Đồng bộ và lưu các khối cùng xây/phá qua Supabase.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path("minecraft/index.html")
          s=p.read_text(encoding="utf-8")
          back='<a href="../" aria-label="Quay lại Game Cá Voi" style="position:fixed;z-index:99999;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));background:#10324ddd;color:#fff;text-decoration:none;padding:10px 13px;border-radius:14px;font:800 13px Arial,sans-serif;box-shadow:0 3px 10px #0005">← Game Cá Voi</a>'
          s=s.replace("<body>", "<body>"+back, 1)
          p.write_text(s,encoding="utf-8")
          PY

      - name: Kiem tra giao dien va multiplayer
        run: |
          if grep -niE "Tap to play|WASD to move|left thumb to move|<h1>minecraft-clone</h1>|<title>minecraft-clone</title>" minecraft/index.html; then
            echo "Phat hien chu giao dien cu trong HTML"
            exit 1
          fi
          grep -F "Chơi cùng nhau" minecraft/index.html >/dev/null
          grep -R -F "Đã vào phòng" minecraft/assets >/dev/null
          grep -R -F "block-world:" minecraft/assets >/dev/null
          echo "Da kiem tra giao dien va multiplayer."

      - name: Commit build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Block World multiplayer giai doan 2 3 4"
            git push
          fi
