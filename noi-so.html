<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nối Số</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef2ff;color:#1f2937}
body{display:flex;justify-content:center}
.app{width:min(100%,560px);min-height:100vh;padding:12px;background:linear-gradient(180deg,#f8faff,#eef2ff)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.iconbtn{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}
.title{flex:1}.title h1{margin:0;font-size:24px}.title p{margin:3px 0 0;color:#6b7280;font-size:12px}
.stats{display:flex;justify-content:space-between;gap:8px;margin:8px 0 12px}
.stat{flex:1;background:#fff;border-radius:15px;padding:9px;text-align:center;box-shadow:0 5px 18px #0000000d}
.stat small{display:block;color:#6b7280;font-size:10px}.stat b{font-size:20px}
.game{position:relative;background:#fff;border-radius:20px;padding:10px;box-shadow:0 8px 28px #00000012}
.grid{display:grid;gap:5px;position:relative;z-index:2;touch-action:none;user-select:none}
.cell{aspect-ratio:1;border:1px solid #dde2ee;border-radius:10px;background:#f8fafc;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(12px,4vw,20px);position:relative;z-index:2;transition:.12s}
.cell.done{background:#4f46e5;color:#fff;border-color:#4f46e5;transform:scale(.93)}
.cell.hint{outline:3px solid #fbbf24;outline-offset:-3px;background:#fffbeb;animation:pulse 1s infinite}
.cell.wrong{animation:shake .22s;background:#fee2e2}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px #fbbf2433}}
.lines{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px);z-index:1;pointer-events:none;overflow:visible}
.lines line{stroke:#818cf8;stroke-width:5;stroke-linecap:round}
.message{text-align:center;color:#6b7280;font-size:13px;margin-top:9px;min-height:20px}
.combo{text-align:center;font-weight:900;color:#4f46e5;height:24px;line-height:24px}
.overlay{position:fixed;inset:0;background:#11182788;display:flex;align-items:center;justify-content:center;padding:18px;z-index:999}
.overlay.hidden{display:none}
.modal{width:min(92vw,390px);background:white;border-radius:22px;padding:22px;text-align:center}
.modal h2{margin:5px 0 14px}
.big{font-size:40px;font-weight:900;color:#4f46e5;margin:12px}
.modal button{width:100%;border:0;border-radius:13px;padding:13px;background:#4f46e5;color:#fff;font-size:16px;font-weight:800;margin-top:9px}
.setting{border-top:1px solid #eceef5;padding:13px 0;text-align:left}
.setting:first-of-type{border-top:0}
.label{font-size:13px;font-weight:800;margin-bottom:9px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{width:auto;margin:0;border:0;border-radius:10px;padding:9px 11px;background:#eef2ff;color:#4338ca;font-weight:800}
.quick button.active{background:#4f46e5;color:#fff}
.custom{display:flex;gap:7px;margin-top:8px}
.custom input{flex:1;min-width:0;border:1px solid #d6d9e5;border-radius:11px;padding:10px;font-size:16px}
.toggleRow{display:flex;align-items:center;justify-content:space-between}
.toggle{width:54px;height:30px;border-radius:30px;background:#c7c9d3;position:relative}
.toggle.on{background:#4f46e5}
.toggle:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s;box-shadow:0 2px 5px #0003}
.toggle.on:after{left:27px}
.secondary{background:#e5e7eb!important;color:#374151!important}
@media(max-width:380px){.cell{border-radius:7px}.grid{gap:3px}.app{padding:9px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="iconbtn" onclick="location.href='./'">←</button>
    <div class="title"><h1>🔢 Nối Số</h1><p>Nối lần lượt các số nhanh nhất có thể</p></div>
    <button class="iconbtn" id="settingsBtn">⚙</button>
  </div>

  <div class="stats">
    <div class="stat"><small>TIẾN ĐỘ</small><b id="progress">0/20</b></div>
    <div class="stat"><small>THỜI GIAN</small><b id="time">0.0s</b></div>
    <div class="stat"><small>TỐT NHẤT</small><b id="best">--</b></div>
  </div>

  <div class="combo" id="combo"></div>

  <div class="game" id="game">
    <svg class="lines" id="lines"></svg>
    <div class="grid" id="grid"></div>
    <div class="message" id="msg">Bắt đầu từ số 1.</div>
  </div>
</div>

<div class="overlay hidden" id="settings">
  <div class="modal">
    <h2>⚙ Cài đặt</h2>

    <div class="setting">
      <div class="label">Phạm vi nối số</div>
      <div class="quick" id="quick">
        <button data-n="10">1–10</button>
        <button data-n="20" class="active">1–20</button>
        <button data-n="30">1–30</button>
        <button data-n="50">1–50</button>
        <button data-n="100">1–100</button>
      </div>
      <div class="custom">
        <input id="range" type="number" min="5" max="100" value="20" inputmode="numeric" placeholder="Nhập số cuối">
        <button id="applyRange" style="width:auto;margin:0">Áp dụng</button>
      </div>
    </div>

    <div class="setting toggleRow">
      <div>
        <div class="label" style="margin:0">Gợi ý số tiếp theo</div>
        <div style="font-size:11px;color:#6b7280;margin-top:3px">Mặc định tắt</div>
      </div>
      <div class="toggle" id="hintToggle"></div>
    </div>

    <button id="restart">Chơi ván mới</button>
    <button id="closeSettings" class="secondary">Đóng</button>
  </div>
</div>

<div class="overlay hidden" id="win">
  <div class="modal">
    <div style="font-size:52px">🎉</div>
    <h2>Hoàn thành!</h2>
    <div class="big" id="finalTime">0.0s</div>
    <p id="recordText"></p>
    <button id="again">Chơi lại</button>
  </div>
</div>

<script>
let maxN=20,nextN=1,startAt=0,timer=null,running=false,pointerDown=false,streak=0;
let hintOn=localStorage.getItem('noiSoHint')==='on';
const grid=document.getElementById('grid'),lines=document.getElementById('lines'),progressEl=document.getElementById('progress'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),range=document.getElementById('range'),msg=document.getElementById('msg'),comboEl=document.getElementById('combo');

function colsFor(n){if(n<=12)return 4;if(n<=20)return 5;if(n<=30)return 6;if(n<=42)return 7;if(n<=56)return 8;if(n<=72)return 9;return 10}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bestKey(){return 'noiSoBest_'+maxN}
function showBest(){const v=localStorage.getItem(bestKey());bestEl.textContent=v?(+v).toFixed(1)+'s':'--'}
function updateHint(){
  grid.querySelectorAll('.hint').forEach(x=>x.classList.remove('hint'));
  if(hintOn&&nextN<=maxN){
    const n=grid.querySelector(`.cell[data-n="${nextN}"]`);
    if(n)n.classList.add('hint');
  }
  document.getElementById('hintToggle').classList.toggle('on',hintOn);
}
function newGame(n=maxN){
  maxN=Math.max(5,Math.min(100,Number(n)||20));range.value=maxN;nextN=1;running=false;pointerDown=false;streak=0;
  clearInterval(timer);timeEl.textContent='0.0s';progressEl.textContent='0/'+maxN;lines.innerHTML='';comboEl.textContent='';
  const nums=shuffle(Array.from({length:maxN},(_,i)=>i+1));
  const cols=colsFor(maxN);grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;grid.innerHTML='';
  nums.forEach(v=>{const d=document.createElement('div');d.className='cell';d.textContent=v;d.dataset.n=v;grid.appendChild(d)});
  showBest();msg.textContent='Bắt đầu từ số 1.';document.getElementById('win').classList.add('hidden');updateHint();
}
function startClock(){if(running)return;running=true;startAt=performance.now();timer=setInterval(()=>{timeEl.textContent=((performance.now()-startAt)/1000).toFixed(1)+'s'},100)}
function center(el){
  const r=el.getBoundingClientRect(),g=grid.getBoundingClientRect();
  return {x:r.left-g.left+r.width/2,y:r.top-g.top+r.height/2}
}
function addLine(a,b){
  const p1=center(a),p2=center(b),ln=document.createElementNS('http://www.w3.org/2000/svg','line');
  ln.setAttribute('x1',p1.x);ln.setAttribute('y1',p1.y);ln.setAttribute('x2',p2.x);ln.setAttribute('y2',p2.y);lines.appendChild(ln)
}
function choose(cell){
  if(!cell||!cell.classList.contains('cell')||cell.classList.contains('done'))return;
  const n=+cell.dataset.n;
  if(n!==nextN){
    if(n>nextN){
      streak=0;comboEl.textContent='';
      cell.classList.remove('wrong');void cell.offsetWidth;cell.classList.add('wrong')
    }
    return;
  }
  if(nextN===1)startClock();
  const prev=grid.querySelector(`.cell[data-n="${nextN-1}"]`);
  if(prev)addLine(prev,cell);
  cell.classList.add('done');cell.classList.remove('hint');
  streak++;
  if(streak>=5)comboEl.textContent='🔥 Chuỗi '+streak;
  nextN++;
  progressEl.textContent=(nextN-1)+'/'+maxN;
  if(nextN>maxN){finish();return}
  msg.textContent=hintOn?'Tiếp tục theo số được gợi ý.':'Tiếp tục tìm số kế tiếp.';
  updateHint();
}
function finish(){
  clearInterval(timer);running=false;
  const sec=(performance.now()-startAt)/1000;timeEl.textContent=sec.toFixed(1)+'s';
  const old=Number(localStorage.getItem(bestKey())||0);let record=false;
  if(!old||sec<old){localStorage.setItem(bestKey(),sec.toFixed(3));record=true}
  showBest();document.getElementById('finalTime').textContent=sec.toFixed(1)+'s';
  document.getElementById('recordText').textContent=record?'🏆 Kỷ lục mới cho phạm vi 1–'+maxN:'Hoàn thành phạm vi 1–'+maxN;
  document.getElementById('win').classList.remove('hidden')
}

grid.addEventListener('pointerdown',e=>{pointerDown=true;grid.setPointerCapture?.(e.pointerId);choose(e.target)});
grid.addEventListener('pointermove',e=>{if(!pointerDown)return;const el=document.elementFromPoint(e.clientX,e.clientY);choose(el)});
grid.addEventListener('pointerup',()=>pointerDown=false);grid.addEventListener('pointercancel',()=>pointerDown=false);

document.getElementById('settingsBtn').onclick=()=>document.getElementById('settings').classList.remove('hidden');
document.getElementById('closeSettings').onclick=()=>document.getElementById('settings').classList.add('hidden');
document.getElementById('hintToggle').onclick=()=>{hintOn=!hintOn;localStorage.setItem('noiSoHint',hintOn?'on':'off');updateHint()};
document.getElementById('restart').onclick=()=>{newGame(maxN);document.getElementById('settings').classList.add('hidden')};
document.getElementById('applyRange').onclick=()=>{newGame(range.value);document.getElementById('settings').classList.add('hidden');syncQuick()};
document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#quick button').forEach(x=>x.classList.remove('active'));b.classList.add('active');newGame(+b.dataset.n);document.getElementById('settings').classList.add('hidden')});
document.getElementById('again').onclick=()=>newGame(maxN);

function syncQuick(){
  document.querySelectorAll('#quick button').forEach(b=>b.classList.toggle('active',+b.dataset.n===maxN));
}
newGame(20);syncQuick();
</script>
</body></html>
