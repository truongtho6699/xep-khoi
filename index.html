<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kho Mini Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#f8fafc,#eef2ff);color:#1f2937;min-height:100vh}
.wrap{width:min(94%,720px);margin:auto;padding:28px 0 40px}
.hero{text-align:center;margin-bottom:24px}
.hero h1{font-size:34px;margin:5px}
.hero p{color:#6b7280;margin:7px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{display:block;text-decoration:none;color:inherit;background:white;border-radius:22px;padding:20px;box-shadow:0 10px 30px #00000010;transition:.15s;position:relative;overflow:hidden}
.card:active{transform:scale(.98)}
.card::after{content:"";position:absolute;right:-25px;top:-25px;width:90px;height:90px;border-radius:50%;opacity:.14}
.card.block::after{background:#f59e0b}
.card.find::after{background:#4f46e5}
.ico{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;overflow:hidden}
.gold{background:linear-gradient(145deg,#fff7d1,#ffe08a)}
.num{background:linear-gradient(145deg,#e8ecff,#cfd7ff)}
.ico img{width:58px;height:58px;display:block}
.card h2{margin:0 0 6px;font-size:21px}
.card p{margin:0;color:#6b7280;font-size:13px;line-height:1.5}
.tag{display:inline-block;margin-top:14px;background:#f3f4f6;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:#4b5563}
@media(max-width:520px){.games{grid-template-columns:1fr}.wrap{padding-top:20px}.hero h1{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🎮 Kho Mini Game</h1>
    <p>Chọn trò chơi và bắt đầu ngay trên điện thoại</p>
  </div>

  <div class="games">
    <a class="card block" href="./xep-khoi.html?v=10">
      <div class="ico gold">
        <img src="./icon-xep-khoi.svg?v=10" alt="Icon Xếp Khối">
      </div>
      <h2>Xếp Khối</h2>
      <p>Xếp các khối vào bàn, hoàn thành hàng hoặc cột để ghi điểm.</p>
      <span class="tag">Kéo & thả</span>
    </a>

    <a class="card find" href="./noi-so.html?v=10">
      <div class="ico num">
        <img src="./icon-tim-so.svg?v=10" alt="Icon Tìm Số">
      </div>
      <h2>Tìm Số</h2>
      <p>Tìm và bấm các số theo đúng thứ tự từ 1 đến N trong thời gian ngắn nhất.</p>
      <span class="tag">1–10 đến 1–100</span>
    </a>
  </div>
</div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}
if('caches' in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)))}
</script>
<div style="text-align:center;color:#9ca3af;font-size:11px;margin-top:24px">Phiên bản 10</div>
</body>
</html>
