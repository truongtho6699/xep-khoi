<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Đếm nhanh · Game Cá Voi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#f0fdf4,#ecfccb);color:#1f2937;min-height:100vh}.wrap{width:min(94vw,720px);margin:auto;padding:14px 0 30px}.top{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{font-size:24px;margin:0}.title p{font-size:12px;color:#6b7280;margin:3px 0 0}.panel{background:#fff;border-radius:20px;padding:14px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;border-radius:999px;padding:9px 12px;font-weight:800;background:#dcfce7;color:#166534}.chip.on{background:#22c55e;color:#fff}.stats{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin:10px 2px}.question{text-align:center;min-height:210px;display:flex;align-items:center;justify-content:center;flex-direction:column}.items{font-size:clamp(34px,10vw,64px);line-height:1.25;max-width:95%;word-break:break-word}.math{font-size:clamp(44px,13vw,82px);font-weight:900;color:#166534}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answers button{min-height:68px;border:0;border-radius:18px;background:#f0fdf4;color:#166534;font-size:28px;font-weight:900;box-shadow:0 4px 12px #0001}.answers button:active{transform:scale(.97)}.msg{text-align:center;font-weight:900;min-height:28px;margin-top:10px}.new{width:100%;border:0;border-radius:14px;padding:12px;background:#16a34a;color:#fff;font-weight:900;font-size:16px;margin-top:8px}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🔢 Đếm nhanh</h1><p>Đếm số lượng hoặc tính phép tính đơn giản</p></div></div><div class="panel"><div class="row"><button class="chip on" data-age="4">👶 4 tuổi</button><button class="chip" data-age="6">🧒 6 tuổi</button></div><div class="stats"><span id="round">Câu: 1/10</span><span id="score">Điểm: 0</span></div><div class="question"><div id="q" class="items"></div></div><div id="answers" class="answers"></div><div id="msg" class="msg"></div><button id="new" class="new">🔄 Chơi lại</button></div></div><script>let age=4,round=1,score=0,answer=0,busy=false;const em=['🍎','🐟','⭐','🚗','🦋','🍓','🐳'];function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}function start(){round=1;score=0;next()}function next(){busy=false;msg.textContent='';if(round>10){q.innerHTML=`<div class="math">🎉 ${score}/10</div>`;answers.innerHTML='';roundEl.textContent='Hoàn thành';return}roundEl.textContent=`Câu: ${round}/10`;scoreEl.textContent=`Điểm: ${score}`;if(age===4){let n=r(1,10),ico=em[r(0,em.length-1)];answer=n;q.className='items';q.textContent=Array(n).fill(ico).join(' ')}else{let a=r(0,12),b=r(0,8),plus=Math.random()<.65;if(!plus&&b>a)[a,b]=[b,a];answer=plus?a+b:a-b;q.className='math';q.textContent=`${a} ${plus?'+':'−'} ${b} = ?`}let opts=new Set([answer]);while(opts.size<4){let v=Math.max(0,answer+r(-4,4));opts.add(v)}let arr=[...opts].sort(()=>Math.random()-.5);answers.innerHTML='';arr.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>pick(v,b);answers.appendChild(b)})}function pick(v,b){if(busy)return;busy=true;if(v===answer){score++;b.style.background='#bbf7d0';msg.textContent='✅ Chính xác!'}else{b.style.background='#fecaca';msg.textContent='💡 Đáp án đúng là '+answer}scoreEl.textContent='Điểm: '+score;setTimeout(()=>{round++;next()},800)}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{age=+x.dataset.age;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===x));start()});document.getElementById('new').onclick=start;const q=document.getElementById('q'),answers=document.getElementById('answers'),roundEl=document.getElementById('round'),scoreEl=document.getElementById('score'),msg=document.getElementById('msg');start();</script></body></html>
