<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tìm điểm khác nhau · Game Cá Voi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fdf2f8,#faf5ff);color:#1f2937;min-height:100vh}.wrap{width:min(96vw,720px);margin:auto;padding:12px 0 28px}.top{display:flex;align-items:center;gap:10px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{font-size:22px;margin:0}.title p{font-size:12px;color:#6b7280;margin:3px 0 0}.panel{background:#fff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;border-radius:999px;padding:10px 13px;font-weight:900;background:#fce7f3;color:#be185d}.chip.on{background:#ec4899;color:#fff}.stats{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:13px;margin:11px 2px}.progress{height:8px;background:#fce7f3;border-radius:99px;overflow:hidden;margin:0 0 12px}.progress>span{display:block;height:100%;width:0;background:#ec4899;transition:.2s}.pics{display:flex;flex-direction:column;gap:12px}.picbox{background:#fdf2f8;border-radius:18px;padding:8px;border:2px solid #fbcfe8}.piclabel{text-align:center;font-weight:900;font-size:12px;color:#9d174d;margin:0 0 7px}.pic{display:grid;gap:5px}.cell{aspect-ratio:1;border:0;border-radius:11px;background:#fff;font-size:clamp(23px,8vw,42px);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0001;position:relative;touch-action:manipulation}.cell.found{outline:4px solid #22c55e;background:#dcfce7}.cell.found:after{content:"✓";position:absolute;right:3px;top:1px;font-size:13px;color:#15803d;font-weight:900}.msg{text-align:center;font-weight:900;min-height:28px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{border:0;border-radius:14px;padding:12px;font-weight:900;font-size:15px}.hint{background:#fef3c7;color:#92400e}.new{background:#db2777;color:#fff}@media(max-width:430px){.panel{padding:10px}.pics{gap:10px}.picbox{padding:6px}.pic{gap:4px}.cell{border-radius:8px}.stats{font-size:12px}.actions button{font-size:14px;padding:11px 8px}}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🔍 Tìm điểm khác nhau</h1><p>So sánh hình trên và hình dưới</p></div></div><div class="panel"><div class="row"><button class="chip on" data-age="4">👶 4 tuổi</button><button class="chip" data-age="6">🧒 6 tuổi</button></div><div class="stats"><span id="count">Đã tìm: 0/3</span><span id="tries">Lượt chạm: 0</span></div><div class="progress"><span id="bar"></span></div><div class="pics"><div class="picbox"><div class="piclabel">HÌNH 1</div><div id="a" class="pic"></div></div><div class="picbox"><div class="piclabel">HÌNH 2</div><div id="b" class="pic"></div></div></div><div id="msg" class="msg"></div><div class="actions"><button id="hint" class="hint">💡 Gợi ý</button><button id="new" class="new">🔄 Hình mới</button></div></div></div><script>let age=4,n=4,diffN=3,left=[],right=[],diffs=new Set(),found=new Set(),tries=0,hints=0;const icons=['🐳','🐟','🐠','🦀','🐙','⭐','🌈','☀️','🍎','🍓','🐶','🐱','🦋','🚗','⚽','🎈'];function r(n){return Math.floor(Math.random()*n)}function start(){n=age===4?4:5;diffN=age===4?3:5;left=Array.from({length:n*n},()=>icons[r(icons.length)]);right=[...left];diffs=new Set;found=new Set;tries=0;hints=0;while(diffs.size<diffN){let i=r(n*n),v=right[i],nv=v;while(nv===v)nv=icons[r(icons.length)];right[i]=nv;diffs.add(i)}msg.textContent='';render()}function render(){for(const[el,arr]of[[A,left],[B,right]]){el.style.gridTemplateColumns=`repeat(${n},1fr)`;el.innerHTML='';arr.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(found.has(i)?' found':'');b.textContent=v;b.onclick=()=>pick(i);el.appendChild(b)})}count.textContent=`Đã tìm: ${found.size}/${diffN}`;triesEl.textContent='Lượt chạm: '+tries;bar.style.width=(found.size/diffN*100)+'%'}function pick(i){tries++;if(diffs.has(i)){found.add(i);msg.textContent='✅ Đúng rồi!';}else msg.textContent='👀 Chưa đúng, nhìn kỹ hai hình nhé!';render();if(found.size===diffN)msg.textContent='🎉 Con đã tìm đủ tất cả điểm khác nhau!'}function hint(){const rest=[...diffs].filter(i=>!found.has(i));if(!rest.length)return;const i=rest[r(rest.length)];hints++;const ca=A.children[i],cb=B.children[i];[ca,cb].forEach(x=>{x.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:650,iterations:2});x.style.boxShadow='0 0 0 4px #fbbf24'});setTimeout(()=>{[ca,cb].forEach(x=>x.style.boxShadow='')},1400);msg.textContent='💡 Hãy nhìn vị trí đang nhấp nháy.'}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{age=+x.dataset.age;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===x));start()});document.getElementById('new').onclick=start;document.getElementById('hint').onclick=hint;const A=document.getElementById('a'),B=document.getElementById('b'),count=document.getElementById('count'),triesEl=document.getElementById('tries'),bar=document.getElementById('bar'),msg=document.getElementById('msg');start();</script></body></html>
