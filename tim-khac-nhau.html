<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tìm điểm khác nhau · Game Cá Voi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fdf2f8,#faf5ff);color:#1f2937;min-height:100vh}.wrap{width:min(96vw,760px);margin:auto;padding:14px 0 30px}.top{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{font-size:23px;margin:0}.title p{font-size:12px;color:#6b7280;margin:3px 0 0}.panel{background:#fff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;border-radius:999px;padding:9px 12px;font-weight:800;background:#fce7f3;color:#be185d}.chip.on{background:#ec4899;color:#fff}.stats{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin:10px 2px}.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pic{display:grid;gap:5px;background:#fdf2f8;padding:7px;border-radius:16px}.cell{aspect-ratio:1;border:0;border-radius:10px;background:#fff;font-size:clamp(20px,7vw,42px);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0001}.cell.found{outline:4px solid #22c55e;background:#dcfce7}.msg{text-align:center;font-weight:900;min-height:28px;margin-top:10px}.new{width:100%;border:0;border-radius:14px;padding:12px;background:#db2777;color:#fff;font-weight:900;font-size:16px;margin-top:8px}@media(max-width:430px){.pics{gap:6px}.pic{gap:3px;padding:4px}.cell{border-radius:7px}}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🔍 Tìm điểm khác nhau</h1><p>So sánh hai bảng và chạm vào chỗ khác nhau</p></div></div><div class="panel"><div class="row"><button class="chip on" data-age="4">👶 4 tuổi</button><button class="chip" data-age="6">🧒 6 tuổi</button></div><div class="stats"><span id="count">Đã tìm: 0/3</span><span id="tries">Lượt chạm: 0</span></div><div class="pics"><div id="a" class="pic"></div><div id="b" class="pic"></div></div><div id="msg" class="msg"></div><button id="new" class="new">🔄 Hình mới</button></div></div><script>let age=4,n=4,diffN=3,left=[],right=[],diffs=new Set(),found=new Set(),tries=0;const icons=['🐳','🐟','🐠','🦀','🐙','⭐','🌈','☀️','🍎','🍓','🐶','🐱','🦋','🚗','⚽','🎈'];function r(n){return Math.floor(Math.random()*n)}function start(){n=age===4?4:5;diffN=age===4?3:5;left=Array.from({length:n*n},()=>icons[r(icons.length)]);right=[...left];diffs=new Set;found=new Set;tries=0;while(diffs.size<diffN){let i=r(n*n),v=right[i],nv=v;while(nv===v)nv=icons[r(icons.length)];right[i]=nv;diffs.add(i)}msg.textContent='';render()}function render(){for(const [el,arr,side] of [[A,left,'a'],[B,right,'b']]){el.style.gridTemplateColumns=`repeat(${n},1fr)`;el.innerHTML='';arr.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(found.has(i)?' found':'');b.textContent=v;b.onclick=()=>pick(i);el.appendChild(b)})}count.textContent=`Đã tìm: ${found.size}/${diffN}`;triesEl.textContent='Lượt chạm: '+tries}function pick(i){tries++;if(diffs.has(i)){found.add(i);msg.textContent='✅ Đúng rồi!';}else msg.textContent='👀 Chưa đúng, nhìn kỹ hơn nhé!';render();if(found.size===diffN){msg.textContent='🎉 Con đã tìm đủ tất cả điểm khác nhau!';}}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{age=+x.dataset.age;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===x));start()});document.getElementById('new').onclick=start;const A=document.getElementById('a'),B=document.getElementById('b'),count=document.getElementById('count'),triesEl=document.getElementById('tries'),msg=document.getElementById('msg');start();</script></body></html>
