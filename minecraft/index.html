<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minecraft Clone</title>
<meta name="theme-color" content="#73a942">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111}
.toolbar{
  position:fixed;z-index:20;top:10px;left:10px;display:flex;gap:8px;
  opacity:.88;transition:.2s
}
.toolbar:hover{opacity:1}
.btn{
  border:0;border-radius:12px;background:#111c;color:#fff;
  padding:10px 12px;font-weight:700;font-size:13px;
  text-decoration:none;box-shadow:0 2px 8px #0005
}
.notice{
  position:fixed;z-index:30;left:50%;bottom:12px;transform:translateX(-50%);
  background:#111c;color:#fff;padding:7px 11px;border-radius:999px;
  font-size:11px;white-space:nowrap;pointer-events:none
}
@media(max-width:600px){
  .toolbar{top:7px;left:7px}
  .btn{padding:9px 10px;font-size:12px}
  .notice{font-size:10px;bottom:7px}
}
</style>
</head>
<body>
<iframe
  src="https://vincent-p-essy.github.io/minecraft-clone/"
  title="Minecraft Clone"
  allow="fullscreen; autoplay; gamepad; pointer-lock"
  allowfullscreen>
</iframe>

<div class="toolbar">
  <a class="btn" href="../">← Game Cá Voi</a>
  <a class="btn" href="https://github.com/Vincent-P-essy/minecraft-clone" target="_blank" rel="noopener">Mã nguồn</a>
</div>

<div class="notice">Bản thử nghiệm Minecraft Clone · mã nguồn MIT</div>
</body>
</html>
