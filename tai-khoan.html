<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tài khoản · Game Cá Voi</title><link rel="icon" href="./icon-ca-voi.svg?v=18" type="image/svg+xml"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#f7fbff,#eef2ff);color:#1f2937;min-height:100vh}.wrap{width:min(94%,720px);margin:auto;padding:18px 0 40px}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{margin:0;font-size:25px}.title p{margin:3px 0 0;color:#6b7280;font-size:12px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 26px #0000000d}.card h2{margin:0 0 12px;font-size:19px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:800;color:#4b5563;margin-bottom:5px}.field input{width:100%;border:1px solid #dbe1ea;border-radius:12px;padding:13px;font-size:18px;background:#fbfdff}.pin{letter-spacing:9px;text-align:center;font-weight:900}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:#4f46e5;color:#fff;font-size:15px;font-weight:800;margin-top:8px}.btn.secondary{background:#eef2ff;color:#4338ca}.btn.danger{background:#fee2e2;color:#991b1b}.status{padding:10px 12px;border-radius:12px;background:#f3f4f6;font-size:13px;margin-bottom:10px}.hidden{display:none!important}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab{white-space:nowrap;border:0;border-radius:999px;padding:9px 12px;background:#eef2ff;color:#4338ca;font-weight:800}.tab.active{background:#4f46e5;color:#fff}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:10px;border:1px solid #edf0f5;border-radius:14px;padding:10px}.rank{width:34px;height:34px;border-radius:50%;background:#eef2ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:900}.grow{flex:1;min-width:0}.name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:#6b7280;margin-top:3px}.score{font-weight:900;color:#4f46e5}.empty{text-align:center;color:#9ca3af;padding:16px 5px;font-size:13px}.searchRow{display:flex;gap:8px}.searchRow input{flex:1;border:1px solid #dbe1ea;border-radius:12px;padding:11px;font-size:15px}.searchRow button{border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:800;padding:0 14px}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🐳 Tài khoản Game Cá Voi</h1><p>Chỉ cần tên người chơi và PIN 4 số</p></div></div><div class="card"><div class="status" id="authStatus">Đang kiểm tra tài khoản…</div><div id="guestArea"><div class="row"><div><h2>Đăng nhập</h2><div class="field"><label>Tên người chơi</label><input id="loginName" maxlength="24" autocomplete="username" placeholder="Ví dụ: Cá Voi Xanh"></div><div class="field"><label>PIN 4 số</label><input id="loginPin" class="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*"></div><button class="btn" id="loginBtn">Vào chơi</button></div><div><h2>Tạo tài khoản</h2><div class="field"><label>Tên người chơi</label><input id="signupName" maxlength="24" placeholder="Chọn tên dễ nhớ"></div><div class="field"><label>PIN 4 số</label><input id="signupPin" class="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*"></div><button class="btn secondary" id="signupBtn">Tạo tài khoản</button><div style="font-size:12px;color:#6b7280;margin-top:8px">Tên người chơi phải khác nhau. Hãy chọn PIN mà bé dễ nhớ nhưng không quá dễ đoán.</div></div></div></div><div id="userArea" class="hidden"><h2>👋 Xin chào <span id="currentName"></span></h2><button class="btn danger" id="logoutBtn">Đổi người chơi / Đăng xuất</button></div></div><div id="signedContent" class="hidden"><div class="card"><div class="tabs"><button class="tab active" data-tab="xep">🏆 Xếp Khối</button><button class="tab" data-tab="tim">⏱ Tìm Số 1–20</button><button class="tab" data-tab="mine">📜 Lịch sử của tôi</button></div><div id="tabBody"><div class="empty">Đang tải…</div></div></div><div class="card"><h2>🔎 Tìm người chơi</h2><div class="searchRow"><input id="searchName" placeholder="Nhập tên người chơi"><button id="searchBtn">Tìm</button></div><div id="searchResults" class="list" style="margin-top:10px"></div></div></div></div><script type="module" src="./supabase-gcv.js?v=18"></script><script>const $=id=>document.getElementById(id);let G=null,currentTab='xep';function msg(t,ok=false){$('authStatus').textContent=t;$('authStatus').style.background=ok?'#ecfdf5':'#f3f4f6';$('authStatus').style.color=ok?'#065f46':'#374151'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function formatMs(ms){return ms==null?'--':(Number(ms)/1000).toFixed(1)+' giây'}function formatDate(s){try{return new Date(s).toLocaleString('vi-VN')}catch(_){return ''}}function renderEmpty(t){$('tabBody').innerHTML='<div class="empty">'+esc(t)+'</div>'}function cleanPin(el){el.value=el.value.replace(/\D/g,'').slice(0,4)}['loginPin','signupPin'].forEach(id=>$(id).addEventListener('input',()=>cleanPin($(id))));async function refreshAuth(){const u=await G.getUser(),signed=!!u;$('guestArea').classList.toggle('hidden',signed);$('userArea').classList.toggle('hidden',!signed);$('signedContent').classList.toggle('hidden',!signed);if(!signed){msg('Chưa đăng nhập.');return}const p=await G.getProfile();$('currentName').textContent=p?.display_name||'Người chơi';msg('Đã đăng nhập.',true);await loadTab(currentTab)}async function loadTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));renderEmpty('Đang tải…');try{if(tab==='xep'){const rows=await G.getXepKhoiLeaderboard(30);$('tabBody').innerHTML=rows.length?'<div class="list">'+rows.map(r=>`<div class="item"><div class="rank">${r.rank}</div><div class="grow"><div class="name">${esc(r.display_name)}</div><div class="sub">Điểm cao nhất</div></div><div class="score">${Number(r.score).toLocaleString('vi-VN')}</div></div>`).join('')+'</div>':'<div class="empty">Chưa có kết quả Xếp Khối.</div>'}else if(tab==='tim'){const rows=await G.getTimSo20Leaderboard(30);$('tabBody').innerHTML=rows.length?'<div class="list">'+rows.map(r=>`<div class="item"><div class="rank">${r.rank}</div><div class="grow"><div class="name">${esc(r.display_name)}</div><div class="sub">Chuẩn 1–20 · không gợi ý</div></div><div class="score">${formatMs(r.duration_ms)}</div></div>`).join('')+'</div>':'<div class="empty">Chưa có kết quả Tìm Số chuẩn 1–20.</div>'}else{const rows=await G.getRecentResults(50);$('tabBody').innerHTML=rows.length?'<div class="list">'+rows.map(r=>`<div class="item"><div class="rank">${r.game_code==='xep-khoi'?'🧩':'🔢'}</div><div class="grow"><div class="name">${r.game_code==='xep-khoi'?'Xếp Khối':'Tìm Số'}</div><div class="sub">${esc(formatDate(r.played_at))}</div></div><div class="score">${r.game_code==='xep-khoi'?Number(r.score).toLocaleString('vi-VN'):formatMs(r.duration_ms)}</div></div>`).join('')+'</div>':'<div class="empty">Chưa có lịch sử chơi.</div>'}}catch(e){renderEmpty('Không tải được dữ liệu.')}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>loadTab(b.dataset.tab));$('loginBtn').onclick=async()=>{msg('Đang đăng nhập…');const {error}=await G.signIn({name:$('loginName').value,pin:$('loginPin').value});if(error){msg('Tên hoặc PIN chưa đúng.');return}await refreshAuth()};$('signupBtn').onclick=async()=>{msg('Đang tạo tài khoản…');const {error}=await G.signUp({name:$('signupName').value,pin:$('signupPin').value});if(error){msg(error.message||'Không tạo được tài khoản.');return}msg('Đã tạo tài khoản.',true);await refreshAuth()};$('logoutBtn').onclick=async()=>{await G.signOut();await refreshAuth()};$('searchBtn').onclick=async()=>{const q=$('searchName').value.trim();if(!q){$('searchResults').innerHTML='';return}try{const rows=await G.searchPlayers(q);$('searchResults').innerHTML=rows.length?rows.map(r=>`<div class="item"><div class="rank">👤</div><div class="grow"><div class="name">${esc(r.display_name)}</div></div></div>`).join(''):'<div class="empty">Không tìm thấy người chơi.</div>'}catch(e){$('searchResults').innerHTML='<div class="empty">Không tìm được người chơi.</div>'}};$('searchName').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});window.addEventListener('gcv-ready',async e=>{G=e.detail;await refreshAuth()},{once:true});if(window.GCV){G=window.GCV;refreshAuth()}</script></body></html>
