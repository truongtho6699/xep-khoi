<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ghép hình · Game Cá Voi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fff7ed,#fefce8);color:#1f2937;min-height:100vh}.wrap{width:min(94vw,720px);margin:auto;padding:14px 0 30px}.top{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{font-size:24px;margin:0}.title p{font-size:12px;color:#6b7280;margin:3px 0 0}.panel{background:#fff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;border-radius:999px;padding:9px 12px;font-weight:800;background:#ffedd5;color:#c2410c}.chip.on{background:#f97316;color:#fff}.sample{margin:12px 0;background:#fff7ed;border:2px dashed #fdba74;border-radius:16px;padding:10px}.sample b{font-size:12px;color:#9a3412}.mini{display:grid;gap:4px;margin-top:7px}.mini span,.tile{display:flex;align-items:center;justify-content:center;border-radius:11px;background:#fef3c7}.board{display:grid;gap:8px;margin:14px auto;max-width:520px}.tile{aspect-ratio:1;border:3px solid transparent;font-size:clamp(30px,10vw,56px);box-shadow:0 4px 12px #0001}.tile.sel{border-color:#f97316;transform:scale(.95)}.stats{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.msg{text-align:center;font-weight:900;min-height:26px}.new{width:100%;border:0;border-radius:14px;padding:12px;background:#ea580c;color:#fff;font-weight:900;font-size:16px}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🧩 Ghép hình</h1><p>Chạm hai ô để đổi chỗ cho đúng mẫu</p></div></div><div class="panel"><div class="row"><button class="chip on" data-age="4">👶 4 tuổi</button><button class="chip" data-age="6">🧒 6 tuổi</button></div><div class="sample"><b>Mẫu cần ghép</b><div id="mini" class="mini"></div></div><div class="stats"><span id="moves">Lượt: 0</span><span id="best">Kỷ lục: —</span></div><div id="board" class="board"></div><div id="msg" class="msg"></div><button class="new" id="new">🔄 Ván mới</button></div></div><script>let age=4,n=2,goal=[],arr=[],selected=null,moves=0;const sets4=['🐳','🌈','⭐','🎈'],sets6=['🐳','🐠','🌴','☀️','⛵','🏝️','🐚','🦀','⭐'];function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){n=age===4?2:3;goal=(age===4?sets4:sets6).slice();arr=shuffle([...goal]);if(arr.every((v,i)=>v===goal[i]))[arr[0],arr[1]]=[arr[1],arr[0]];moves=0;selected=null;render();msg.textContent=''}function render(){mini.style.gridTemplateColumns=`repeat(${n},1fr)`;board.style.gridTemplateColumns=`repeat(${n},1fr)`;mini.innerHTML=goal.map(x=>`<span style="aspect-ratio:1;font-size:${age===4?'28':'22'}px">${x}</span>`).join('');board.innerHTML='';arr.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(selected===i?' sel':'');b.textContent=v;b.onclick=()=>pick(i);board.appendChild(b)});movesEl.textContent='Lượt: '+moves;let k='puzzleBest'+age,b=localStorage.getItem(k);bestEl.textContent='Kỷ lục: '+(b?b+' lượt':'—')}function pick(i){if(selected===null){selected=i;render();return}if(selected===i){selected=null;render();return}[arr[selected],arr[i]]=[arr[i],arr[selected]];moves++;selected=null;render();if(arr.every((v,j)=>v===goal[j]))finish()}function finish(){let k='puzzleBest'+age,b=+(localStorage.getItem(k)||9999);if(moves<b)localStorage.setItem(k,moves);msg.textContent='🎉 Ghép đúng rồi! Tuyệt lắm!';render()}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{age=+x.dataset.age;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===x));start()});newBtn=document.getElementById('new');newBtn.onclick=start;const mini=document.getElementById('mini'),board=document.getElementById('board'),movesEl=document.getElementById('moves'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');start();</script></body></html>
