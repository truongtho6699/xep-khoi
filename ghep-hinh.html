<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ghép hình · Game Cá Voi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fff7ed,#fefce8);color:#1f2937;min-height:100vh}.wrap{width:min(94vw,700px);margin:auto;padding:12px 0 28px}.top{display:flex;align-items:center;gap:10px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{font-size:22px;margin:0}.title p{font-size:12px;color:#6b7280;margin:3px 0 0}.panel{background:#fff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px}.chip{flex:1;border:0;border-radius:14px;padding:11px 8px;font-weight:900;background:#ffedd5;color:#c2410c}.chip.on{background:#f97316;color:#fff}.samplebar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px}.samplebar b{font-size:13px;color:#9a3412}.peek{border:0;border-radius:12px;padding:8px 10px;background:#fef3c7;color:#92400e;font-weight:900}.sample{background:#fff7ed;border:2px dashed #fdba74;border-radius:16px;padding:9px;transition:.2s}.sample.hidden{max-height:0;padding-top:0;padding-bottom:0;border-width:0;overflow:hidden;opacity:0}.mini{display:grid;gap:4px}.mini span,.tile{display:flex;align-items:center;justify-content:center;border-radius:11px;background:#fef3c7}.stats{display:flex;justify-content:space-between;font-size:13px;font-weight:900;margin:11px 2px}.board{display:grid;gap:8px;margin:10px auto 12px;max-width:500px}.tile{aspect-ratio:1;border:3px solid transparent;font-size:clamp(34px,11vw,58px);box-shadow:0 4px 12px #0001;touch-action:manipulation}.tile.sel{border-color:#f97316;transform:scale(.94);box-shadow:0 0 0 4px #fed7aa}.hint{text-align:center;color:#9a3412;font-size:12px;font-weight:800;margin-bottom:8px}.msg{text-align:center;font-weight:900;min-height:26px}.new{width:100%;border:0;border-radius:14px;padding:13px;background:#ea580c;color:#fff;font-weight:900;font-size:16px}@media(max-width:430px){.panel{padding:10px}.board{gap:7px}.tile{border-radius:10px}.sample{padding:7px}}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🧩 Ghép hình</h1><p>Chạm 2 ô để đổi chỗ cho đúng mẫu</p></div></div><div class="panel"><div class="row"><button class="chip on" data-age="4">👶 4 tuổi · 2×2</button><button class="chip" data-age="6">🧒 6 tuổi · 3×3</button></div><div class="samplebar"><b>👀 Mẫu cần ghép</b><button id="peek" class="peek">Ẩn mẫu</button></div><div id="sample" class="sample"><div id="mini" class="mini"></div></div><div class="stats"><span id="moves">Lượt: 0</span><span id="best">Kỷ lục: —</span></div><div class="hint">Chọn một ô, sau đó chọn ô thứ hai để đổi vị trí.</div><div id="board" class="board"></div><div id="msg" class="msg"></div><button class="new" id="new">🔄 Ván mới</button></div></div><script>let age=4,n=2,goal=[],arr=[],selected=null,moves=0,showSample=true;const sets4=['🐳','🌈','⭐','🎈'],sets6=['🐳','🐠','🌴','☀️','⛵','🏝️','🐚','🦀','⭐'];function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){n=age===4?2:3;goal=(age===4?sets4:sets6).slice();arr=shuffle([...goal]);if(arr.every((v,i)=>v===goal[i]))[arr[0],arr[1]]=[arr[1],arr[0]];moves=0;selected=null;msg.textContent='';showSample=true;sample.classList.remove('hidden');peek.textContent='Ẩn mẫu';render()}function render(){mini.style.gridTemplateColumns=`repeat(${n},1fr)`;board.style.gridTemplateColumns=`repeat(${n},1fr)`;mini.innerHTML=goal.map(x=>`<span style="aspect-ratio:1;font-size:${age===4?'30':'24'}px">${x}</span>`).join('');board.innerHTML='';arr.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(selected===i?' sel':'');b.textContent=v;b.onclick=()=>pick(i);board.appendChild(b)});movesEl.textContent='Lượt: '+moves;let k='puzzleBest'+age,b=localStorage.getItem(k);bestEl.textContent='Kỷ lục: '+(b?b+' lượt':'—')}function pick(i){if(selected===null){selected=i;msg.textContent='👉 Chọn ô muốn đổi với ô đang sáng.';render();return}if(selected===i){selected=null;msg.textContent='';render();return}[arr[selected],arr[i]]=[arr[i],arr[selected]];moves++;selected=null;msg.textContent='';render();if(arr.every((v,j)=>v===goal[j]))finish()}function finish(){let k='puzzleBest'+age,b=+(localStorage.getItem(k)||9999);if(moves<b)localStorage.setItem(k,moves);msg.textContent='🎉 Ghép đúng rồi! Tuyệt lắm!';render()}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{age=+x.dataset.age;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===x));start()});document.getElementById('new').onclick=start;document.getElementById('peek').onclick=()=>{showSample=!showSample;sample.classList.toggle('hidden',!showSample);peek.textContent=showSample?'Ẩn mẫu':'Xem mẫu'};const sample=document.getElementById('sample'),peek=document.getElementById('peek'),mini=document.getElementById('mini'),board=document.getElementById('board'),movesEl=document.getElementById('moves'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');start();</script></body></html>
