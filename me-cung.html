<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mê cung · Game Cá Voi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#ecfeff,#eff6ff);color:#1f2937;min-height:100vh}.wrap{width:min(94vw,700px);margin:auto;padding:12px 0 28px}.top{display:flex;align-items:center;gap:10px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{font-size:22px;margin:0}.title p{font-size:12px;color:#6b7280;margin:3px 0 0}.panel{background:#fff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px}.chip{flex:1;border:0;border-radius:14px;padding:11px 8px;font-weight:900;background:#cffafe;color:#0f766e}.chip.on{background:#06b6d4;color:#fff}.stats{display:flex;justify-content:space-between;font-weight:900;font-size:13px;margin:10px 2px}.maze{display:grid;margin:8px auto;background:#0f172a;border:4px solid #0f172a;border-radius:16px;overflow:hidden;max-width:540px;aspect-ratio:1;touch-action:none}.cell{display:flex;align-items:center;justify-content:center;background:#fff;font-size:clamp(13px,4vw,25px)}.wall{background:#0f172a}.player{background:#dbeafe}.goal{background:#fef3c7}.tip{text-align:center;font-size:12px;color:#475569;font-weight:800;margin-top:8px}.controls{width:min(250px,78vw);margin:12px auto 6px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:". up ." "left center right" ". down .";gap:8px}.controls button{aspect-ratio:1;border:0;border-radius:18px;background:#2563eb;color:#fff;font-size:29px;font-weight:900;box-shadow:0 5px 12px #0002;touch-action:manipulation}.controls button:active{transform:scale(.94)}.up{grid-area:up}.left{grid-area:left}.right{grid-area:right}.down{grid-area:down}.center{grid-area:center;background:#e0f2fe!important;color:#0369a1!important;font-size:20px!important}.msg{text-align:center;font-weight:900;min-height:26px}.new{width:100%;border:0;border-radius:14px;padding:13px;background:#0891b2;color:#fff;font-weight:900;font-size:16px}@media(max-width:430px){.panel{padding:10px}.controls{width:min(220px,74vw)}.controls button{border-radius:16px;font-size:26px}}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🐳 Mê cung</h1><p>Đưa cá voi đến kho báu 🎁</p></div></div><div class="panel"><div class="row"><button class="chip on" data-age="4">👶 4 tuổi · Dễ</button><button class="chip" data-age="6">🧒 6 tuổi · Khó hơn</button></div><div class="stats"><span id="steps">Bước: 0</span><span id="best">Kỷ lục: —</span></div><div id="maze" class="maze"></div><div class="tip">Vuốt trên mê cung hoặc dùng các nút phía dưới.</div><div class="controls"><button class="up" onclick="move(0,-1)">⬆</button><button class="left" onclick="move(-1,0)">⬅</button><button class="center" aria-label="Cá voi">🐳</button><button class="right" onclick="move(1,0)">➡</button><button class="down" onclick="move(0,1)">⬇</button></div><div id="msg" class="msg"></div><button id="new" class="new">🔄 Mê cung mới</button></div></div><script>let age=4,size=7,grid=[],px=1,py=1,gx=0,gy=0,steps=0;function mazeGen(n){let a=Array.from({length:n},()=>Array(n).fill(1));function dig(x,y){a[y][x]=0;let ds=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5);for(const[dX,dY]of ds){let nx=x+dX,ny=y+dY;if(nx>0&&ny>0&&nx<n-1&&ny<n-1&&a[ny][nx]){a[y+dY/2][x+dX/2]=0;dig(nx,ny)}}}dig(1,1);return a}function start(){size=age===4?7:11;grid=mazeGen(size);px=py=1;gx=gy=size-2;grid[gy][gx]=0;steps=0;msg.textContent='';render()}function render(){maze.style.gridTemplateColumns=`repeat(${size},1fr)`;maze.innerHTML='';for(let y=0;y<size;y++)for(let x=0;x<size;x++){let c=document.createElement('div');c.className='cell'+(grid[y][x]?' wall':'');if(x===gx&&y===gy){c.classList.add('goal');c.textContent='🎁'}if(x===px&&y===py){c.classList.add('player');c.textContent='🐳'}maze.appendChild(c)}stepsEl.textContent='Bước: '+steps;let b=localStorage.getItem('mazeBest'+age);bestEl.textContent='Kỷ lục: '+(b?b+' bước':'—')}function move(dx,dy){let nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=size||ny>=size||grid[ny][nx]){msg.textContent='🧱 Có tường rồi!';setTimeout(()=>{if(msg.textContent==='🧱 Có tường rồi!')msg.textContent=''},500);return}px=nx;py=ny;steps++;render();if(px===gx&&py===gy){let k='mazeBest'+age,b=+(localStorage.getItem(k)||9999);if(steps<b)localStorage.setItem(k,steps);msg.textContent='🎉 Tìm thấy kho báu rồi!';render()}}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{age=+x.dataset.age;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===x));start()});document.getElementById('new').onclick=start;const maze=document.getElementById('maze'),stepsEl=document.getElementById('steps'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');let sx=0,sy=0;maze.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});maze.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')move(0,-1);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0)});start();</script></body></html>
