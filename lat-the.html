<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lật thẻ trí nhớ · Game Cá Voi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#eff6ff,#fdf2f8);color:#1f2937;min-height:100vh}.wrap{width:min(94vw,700px);margin:auto;padding:12px 0 28px}.top{display:flex;align-items:center;gap:10px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{font-size:22px;margin:0}.title p{font-size:12px;color:#6b7280;margin:3px 0 0}.panel{background:#fff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px}.chip{flex:1;border:0;border-radius:14px;padding:11px 8px;font-weight:900;background:#eef2ff;color:#4338ca}.chip.on{background:#4f46e5;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:11px 0}.stat{background:#f8fafc;border-radius:12px;padding:8px 5px;text-align:center;font-weight:900;font-size:12px}.grid{display:grid;gap:9px}.grid.age4{grid-template-columns:repeat(3,1fr)}.grid.age6{grid-template-columns:repeat(4,1fr)}.card{aspect-ratio:1;border:0;border-radius:16px;background:linear-gradient(145deg,#60a5fa,#6366f1);font-size:0;box-shadow:0 5px 12px #0002;transition:.18s;transform-style:preserve-3d;touch-action:manipulation}.card:after{content:'🐳';font-size:25px;opacity:.8}.card.open,.card.matched{background:#fff;font-size:clamp(30px,10vw,54px);transform:rotateY(180deg)}.card.open:after,.card.matched:after{content:''}.card.matched{outline:3px solid #86efac;background:#f0fdf4}.msg{text-align:center;font-weight:900;min-height:26px;margin:10px 0}.new{width:100%;border:0;border-radius:14px;padding:13px;background:#10b981;color:#fff;font-weight:900;font-size:16px}@media(max-width:430px){.grid{gap:7px}.card{border-radius:13px}.panel{padding:10px}.stat{font-size:11px}}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🧠 Lật thẻ trí nhớ</h1><p>Lật 2 thẻ và tìm cặp giống nhau</p></div></div><div class="panel"><div class="row"><button class="chip on" data-age="4">👶 4 tuổi · 6 cặp</button><button class="chip" data-age="6">🧒 6 tuổi · 8 cặp</button></div><div class="stats"><div class="stat" id="moves">Lượt: 0</div><div class="stat" id="pairs">Đúng: 0/6</div><div class="stat" id="best">Kỷ lục: —</div></div><div id="grid" class="grid age4"></div><div id="msg" class="msg"></div><button class="new" id="new">🔄 Ván mới</button></div></div><script>const icons=['🐳','🐶','🐱','🐼','🦁','🐸','🐵','🦄','🐧','🐰','🐯','🦊'];let age=4,open=[],lock=false,moves=0,matched=0,total=6;const g=document.getElementById('grid');function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){open=[];lock=false;moves=matched=0;total=age===4?6:8;g.className='grid '+(age===4?'age4':'age6');let vals=shuffle([...icons]).slice(0,total);vals=shuffle([...vals,...vals]);g.innerHTML='';vals.forEach(v=>{let b=document.createElement('button');b.className='card';b.dataset.v=v;b.onclick=()=>flip(b);g.appendChild(b)});update();msg.textContent=''}function flip(b){if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;b.classList.add('open');b.textContent=b.dataset.v;open.push(b);if(open.length===2){moves++;update();if(open[0].dataset.v===open[1].dataset.v){open.forEach(x=>{x.classList.remove('open');x.classList.add('matched')});matched++;open=[];msg.textContent='✅ Đúng rồi!';update();if(matched===total)finish()}else{lock=true;msg.textContent='👀 Nhớ hai hình này nhé!';setTimeout(()=>{open.forEach(x=>{x.classList.remove('open');x.textContent=''});open=[];lock=false;msg.textContent=''},1050)}}}function update(){movesEl.textContent='Lượt: '+moves;pairsEl.textContent=`Đúng: ${matched}/${total}`;let k='memoryBest'+age,b=localStorage.getItem(k);bestEl.textContent='Kỷ lục: '+(b?b:'—')}function finish(){let k='memoryBest'+age,b=+(localStorage.getItem(k)||9999);if(moves<b)localStorage.setItem(k,moves);msg.textContent='🎉 Giỏi quá! Con đã tìm hết các cặp!';update()}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{age=+x.dataset.age;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===x));start()});document.getElementById('new').onclick=start;const movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');start();</script></body></html>
