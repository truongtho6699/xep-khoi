<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lật thẻ trí nhớ · Game Cá Voi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#eff6ff,#fdf2f8);color:#1f2937;min-height:100vh}.wrap{width:min(94vw,720px);margin:auto;padding:14px 0 30px}.top{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0001;font-size:22px}.title{flex:1}.title h1{font-size:24px;margin:0}.title p{font-size:12px;color:#6b7280;margin:3px 0 0}.panel{background:#fff;border-radius:20px;padding:12px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;border-radius:999px;padding:9px 12px;font-weight:800;background:#eef2ff;color:#4338ca}.chip.on{background:#4f46e5;color:#fff}.stats{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin:10px 2px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{aspect-ratio:1;border:0;border-radius:16px;background:linear-gradient(145deg,#60a5fa,#6366f1);font-size:0;box-shadow:0 5px 12px #0002;transition:.18s;transform-style:preserve-3d}.card.open,.card.matched{background:#fff;font-size:clamp(28px,9vw,50px);transform:rotateY(180deg)}.card.matched{outline:3px solid #86efac}.msg{text-align:center;font-weight:900;min-height:24px;margin:10px}.new{width:100%;border:0;border-radius:14px;padding:12px;background:#10b981;color:#fff;font-weight:900;font-size:16px}@media(min-width:600px){.grid.hard{grid-template-columns:repeat(5,1fr)}} </style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">←</button><div class="title"><h1>🧠 Lật thẻ trí nhớ</h1><p>Tìm hai hình giống nhau</p></div></div><div class="panel"><div class="row"><button class="chip on" data-age="4">👶 4 tuổi</button><button class="chip" data-age="6">🧒 6 tuổi</button></div><div class="stats"><span id="moves">Lượt: 0</span><span id="pairs">Đúng: 0/6</span><span id="best">Kỷ lục: —</span></div><div id="grid" class="grid"></div><div id="msg" class="msg"></div><button class="new" id="new">🔄 Ván mới</button></div></div><script>const icons=['🐳','🐶','🐱','🐼','🦁','🐸','🐵','🦄','🐧','🐰','🐯','🦊'];let age=4,open=[],lock=false,moves=0,matched=0,total=6;const g=document.getElementById('grid');function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){open=[];lock=false;moves=matched=0;total=age===4?6:10;g.className='grid'+(age===6?' hard':'');let vals=shuffle([...icons]).slice(0,total);vals=shuffle([...vals,...vals]);g.innerHTML='';vals.forEach((v,i)=>{let b=document.createElement('button');b.className='card';b.dataset.v=v;b.dataset.i=i;b.onclick=()=>flip(b);g.appendChild(b)});update();msg.textContent=''}function flip(b){if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;b.classList.add('open');b.textContent=b.dataset.v;open.push(b);if(open.length===2){moves++;update();if(open[0].dataset.v===open[1].dataset.v){open.forEach(x=>{x.classList.remove('open');x.classList.add('matched')});matched++;open=[];update();if(matched===total)finish()}else{lock=true;setTimeout(()=>{open.forEach(x=>{x.classList.remove('open');x.textContent=''});open=[];lock=false},700)}}}function update(){movesEl.textContent='Lượt: '+moves;pairsEl.textContent=`Đúng: ${matched}/${total}`;let k='memoryBest'+age,b=localStorage.getItem(k);bestEl.textContent='Kỷ lục: '+(b?b+' lượt':'—')}function finish(){let k='memoryBest'+age,b=+(localStorage.getItem(k)||9999);if(moves<b)localStorage.setItem(k,moves);msg.textContent='🎉 Giỏi quá! Con đã tìm hết các cặp!';update()}document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{age=+x.dataset.age;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===x));start()});newBtn=document.getElementById('new');newBtn.onclick=start;const movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');start();</script></body></html>
